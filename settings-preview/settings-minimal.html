<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pengaturan - Minimalist</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif;
      background: #F2F2F7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .phone-frame {
      width: 375px;
      height: 812px;
      margin: 40px auto;
      background: #FFFFFF;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
      position: relative;
    }

    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 30px;
      background: #000;
      border-radius: 0 0 20px 20px;
      z-index: 100;
    }

    .status-bar {
      height: 44px;
      background: #FFFFFF;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 24px 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .status-bar .time {
      font-weight: 600;
    }

    .status-bar .icons {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .screen {
      height: calc(100% - 44px);
      overflow-y: auto;
      background: #FFFFFF;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: #FFFFFF;
      border-bottom: 0.5px solid #E5E5EA;
    }

    .back-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background: none;
      border: none;
      cursor: pointer;
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      color: #007AFF;
    }

    .header-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
      color: #1C1C1E;
      margin-right: 44px;
    }

    /* Content */
    .content {
      padding: 24px 16px;
    }

    /* Section */
    .section {
      margin-bottom: 32px;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    .section-header {
      font-size: 13px;
      font-weight: 600;
      color: #8E8E93;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 16px;
      margin-bottom: 8px;
    }

    .section-group {
      background: #FFFFFF;
      border-radius: 10px;
      overflow: hidden;
    }

    /* Row */
    .row {
      display: flex;
      align-items: center;
      min-height: 44px;
      padding: 10px 16px;
      background: #FFFFFF;
    }

    .row + .row {
      border-top: 0.5px solid #E5E5EA;
    }

    .row-icon {
      width: 24px;
      height: 24px;
      margin-right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8E8E93;
    }

    .row-icon svg {
      width: 18px;
      height: 18px;
    }

    .row-content {
      flex: 1;
      min-width: 0;
    }

    .row-title {
      font-size: 17px;
      color: #1C1C1E;
    }

    .row-subtitle {
      font-size: 13px;
      color: #8E8E93;
      margin-top: 2px;
    }

    .row-value {
      font-size: 17px;
      color: #8E8E93;
      margin-right: 8px;
    }

    .row-action {
      font-size: 15px;
      color: #007AFF;
      background: none;
      border: none;
      padding: 8px 0;
      cursor: pointer;
    }

    .row-badge {
      font-size: 12px;
      color: #8E8E93;
      background: #F2F2F7;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .row-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .row-indicator.online {
      background: #34C759;
    }

    .row-indicator.offline {
      background: #FF9500;
    }

    /* Version Row */
    .version-row {
      display: flex;
      align-items: center;
    }

    .version-icon {
      width: 44px;
      height: 44px;
      background: #F2F2F7;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
    }

    .version-icon svg {
      width: 22px;
      height: 22px;
      color: #8E8E93;
    }

    .version-info {
      flex: 1;
    }

    .version-label {
      font-size: 17px;
      color: #1C1C1E;
    }

    .version-number {
      font-size: 13px;
      color: #8E8E93;
      margin-top: 2px;
    }

    /* Status Card */
    .status-card {
      background: #FFFFFF;
      border-radius: 10px;
      padding: 16px;
    }

    .status-card + .status-card {
      margin-top: 1px;
    }

    .status-header {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .status-header .icon {
      width: 36px;
      height: 36px;
      background: #F2F2F7;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
    }

    .status-header .icon svg {
      width: 18px;
      height: 18px;
      color: #8E8E93;
    }

    .status-header .info {
      flex: 1;
    }

    .status-header .label {
      font-size: 15px;
      font-weight: 500;
      color: #1C1C1E;
    }

    .status-header .sublabel {
      font-size: 13px;
      color: #8E8E93;
    }

    .status-header .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .status-header .badge.online {
      background: #E8F5E9;
      color: #34C759;
    }

    .status-header .badge.offline {
      background: #FFF3E0;
      color: #FF9500;
    }

    /* Server Config */
    .server-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
    }

    .server-url {
      flex: 1;
      font-size: 14px;
      font-family: 'SF Mono', Monaco, monospace;
      color: #8E8E93;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Footer */
    .footer {
      padding: 24px 16px;
      text-align: center;
    }

    .footer-text {
      font-size: 13px;
      color: #8E8E93;
      line-height: 1.5;
    }

    .footer-text span {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: #C7C7CC;
    }

    /* Responsive */
    @media (max-width: 420px) {
      .phone-frame {
        margin: 0;
        border-radius: 0;
        height: 100vh;
        width: 100%;
      }

      .notch {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="notch"></div>

    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="icons">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
          <path d="M8 2.4C9.6 2.4 10.8 3.2 11.6 4.4L13 3.2C11.8 1.6 10 0.4 8 0.4C5.8 0.4 3.8 1.6 2.6 3.4L4 4.6C4.8 3.4 6 2.4 8 2.4ZM8 0.8C4.8 0.8 2 3.6 2 6.8C2 10 4.8 12.8 8 12.8C11.2 12.8 14 10 14 6.8H12C12 8.6 10.6 10 8 10C5.4 10 4 8.6 4 6.8C4 5 5.4 3.6 8 3.6C8.4 3.6 8.8 3.7 9.2 3.9L10.2 2.9C9.6 2.5 9.2 2.2 8.8 1.9C8.5 1.6 8.2 1.4 8 1.2C8 1.1 8 0.9 8 0.8Z"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
          <path d="M4.5 4.5C4.5 5.3 3.8 6 3 6C2.2 6 1.5 5.3 1.5 4.5C1.5 3.7 2.2 3 3 3C3.8 3 4.5 3.7 4.5 4.5ZM6 4.5C6 5.3 5.3 6 4.5 6C3.7 6 3 5.3 3 4.5C3 3.7 3.7 3 4.5 3C5.3 3 6 3.7 6 4.5ZM8 6C9.7 6 11 7.3 11 9V10H1V9C1 7.3 2.3 6 4 6H8ZM11.5 8.5C11.5 7.9 11.1 7.5 10.5 7.5C9.9 7.5 9.5 7.9 9.5 8.5C9.5 9.1 9.9 9.5 10.5 9.5C11.1 9.5 11.5 9.1 11.5 8.5Z"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor">
          <rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="currentColor" stroke-width="1" fill="none"/>
          <rect x="2" y="2" width="17" height="8" rx="1" fill="currentColor"/>
          <rect x="19" y="3.5" width="2" height="5" rx="0.5" fill="currentColor"/>
        </svg>
      </div>
    </div>

    <div class="screen">
      <!-- Header -->
      <div class="header">
        <button class="back-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <span class="header-title">Pengaturan</span>
      </div>

      <!-- Content -->
      <div class="content">

        <!-- Section: Version -->
        <div class="section">
          <div class="section-header">Versi Aplikasi</div>
          <div class="section-group">
            <div class="row version-row">
              <div class="version-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <rect x="5" y="2" width="14" height="20" rx="3" stroke-linecap="round" stroke-linejoin="round"/>
                  <line x1="12" y1="18" x2="12" y2="18.01" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="version-info">
                <div class="version-label">Trip Angkutan</div>
                <div class="version-number">Versi 1.0.3</div>
              </div>
              <button class="row-action">Periksa Update</button>
            </div>
          </div>
        </div>

        <!-- Section: Connection -->
        <div class="section">
          <div class="section-header">Koneksi</div>
          <div class="section-group">
            <div class="status-card">
              <div class="status-header">
                <div class="icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="2" y1="12" x2="22" y2="12"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                  </svg>
                </div>
                <div class="info">
                  <div class="label">Server</div>
                  <div class="sublabel">Terhubung</div>
                </div>
                <span class="badge online">Online</span>
              </div>
            </div>

            <div class="status-card">
              <div class="status-header">
                <div class="icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                    <line x1="12" y1="20" x2="12.01" y2="20"/>
                  </svg>
                </div>
                <div class="info">
                  <div class="label">OTA Update</div>
                  <div class="sublabel">Sinkron otomatis aktif</div>
                </div>
                <span class="badge online">Aktif</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Section: Server Config -->
        <div class="section">
          <div class="section-header">Konfigurasi Server</div>
          <div class="section-group">
            <div class="server-row" style="border-top: 0.5px solid #E5E5EA;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.5" style="margin-right: 12px;">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <span class="server-url">https://api.trip-angkut.example.com/v1</span>
              <span class="row-badge">Read-only</span>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div class="footer">
          <p class="footer-text">
            Trip Angkutan
            <span>Offline-first · Data tersimpan lokal</span>
          </p>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
