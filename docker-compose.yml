services:
  web:
    build: .
    image: trip-angkutan
    container_name: trip-web
    restart: unless-stopped
    ports:
      # Bind EKSPLISIT ke 0.0.0.0 (bukan 127.0.0.1) supaya perangkat mobile
      # di WiFi Linksys bisa menjangkau lewat http://192.168.1.123:8000
      - "0.0.0.0:8000:8000"
      - "0.0.0.0:5173:5173"

  # API INTRANET (port 3000) - Edge Function yang sama dengan produksi,
  # dijawab dari jaringan lokal kantor (192.168.1.123).
  #
  # Env diambil dari supabase/functions/api/.env.local.
  # File itu WAJIB ADA (boleh berisi nilai kosong) - restart-all-ubuntu.sh
  # membuatnya otomatis dari .env.example kalau belum ada.
  api-intranet:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: trip-angkutan-api
    container_name: trip-api
    # on-failure (bukan unless-stopped): kalau secret belum diisi, server
    # menolak start. Dengan unless-stopped dia masuk crash-loop tanpa henti
    # dan log jadi spam terus; on-failure:5 berhenti setelah 5 percobaan dan
    # container terlihat "Exited (1)" - jelas bahwa ini soal konfigurasi.
    restart: on-failure:5
    ports:
      - "0.0.0.0:3000:3000"
    env_file:
      - supabase/functions/api/.env.local
