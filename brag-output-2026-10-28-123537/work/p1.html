<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>Trip Angkutan — brag composition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --emerald:#10b981; --emerald-600:#059669; --emerald-100:#d1fae5; --emerald-50:#ecfdf5;
    --amber:#f59e0b; --amber-logo:#ffbd15;
    --ink:#0f172a; --slate-700:#334155; --slate-600:#475569; --slate-500:#64748b;
    --slate-400:#94a3b8; --slate-300:#cbd5e1; --slate-200:#e2e8f0; --slate-100:#f1f5f9;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:#04160f;
    font-family:'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; }
  #bg { position:absolute; inset:0; background:
      radial-gradient(1200px 700px at 78% 12%, rgba(16,185,129,.16), transparent 62%),
      radial-gradient(900px 620px at 12% 88%, rgba(15,81,50,.55), transparent 66%),
      linear-gradient(160deg,#04160f 0%,#06251a 45%,#082b1a 100%); }
  #grain { position:absolute; inset:0; opacity:.28; mix-blend-mode:overlay;
    background-image:radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px); background-size:3px 3px; }
  #vignette { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 100% at 50% 45%, transparent 42%, rgba(0,0,0,.5) 100%); }
  .scene { position:absolute; inset:0; will-change:opacity; }
  .h { font-weight:800; letter-spacing:-0.025em; line-height:1.04; }
  .kicker { font-size:15px; font-weight:700; letter-spacing:.30em; text-transform:uppercase; color:#6ee7b7; }
  .body { color:#cbd5e1; font-size:25px; font-weight:500; line-height:1.45; }
  .card { background:#fff; border-radius:28px; box-shadow:0 34px 90px rgba(0,0,0,.48), 0 2px 0 rgba(255,255,255,.08); }
  .chip { display:inline-flex; align-items:center; gap:12px; padding:15px 24px; border-radius:16px;
    background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.14); color:#e2e8f0;
    font-size:20px; font-weight:600; }
  .chip svg { width:24px; height:24px; }
  .phone { width:372px; height:742px; border-radius:44px; background:#0f172a; padding:14px;
    box-shadow:0 40px 90px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.09); position:relative; }
  .phone .screen { width:100%; height:100%; border-radius:32px; background:#f8fafc; overflow:hidden; display:flex; flex-direction:column; }
  .statusbar { height:36px; display:flex; align-items:center; justify-content:space-between; padding:0 20px;
    font-size:12px; font-weight:700; color:#0f172a; background:#fff; }
  .notch { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:112px; height:24px;
    border-radius:0 0 16px 16px; background:#0f172a; }
  .p-label { font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:#94a3b8; }
  .p-title { font-size:20px; font-weight:800; color:#0f172a; letter-spacing:-.02em; }
  .p-body { font-size:12px; color:#475569; }
  .p-input { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:11px 14px;
    font-size:14px; font-weight:600; color:#0f172a; }
  .p-btn { border-radius:12px; padding:13px; text-align:center; font-size:14px; font-weight:800; }
  .p-btn-on { background:#10b981; color:#fff; }
  .p-btn-off { background:#e2e8f0; color:#94a3b8; }
  .toast { display:flex; align-items:center; gap:14px; background:#0f172a; color:#fff;
    border-radius:18px; padding:18px 24px; font-size:19px; font-weight:700; box-shadow:0 24px 60px rgba(0,0,0,.5); }
  .toast .dot { width:12px; height:12px; border-radius:999px; background:#10b981; box-shadow:0 0 0 6px rgba(16,185,129,.18); }
  table.grid { border-collapse:separate; border-spacing:0; width:100%; }
  table.grid th { background:#f1f5f9; color:#64748b; font-size:12px; font-weight:800; letter-spacing:.08em;
    text-transform:uppercase; padding:13px 16px; border:1px solid #e2e8f0; text-align:center; }
  table.grid th:first-child { text-align:left; }
  table.grid td { border:1px solid #e2e8f0; padding:11px 16px; font-size:16px; color:#334155; text-align:center; }
  table.grid td:first-child { text-align:left; font-weight:700; color:#1e293b; }
  table.grid tr:nth-child(even) td { background:#f8fafc; }
  .iconbtn { width:32px; height:32px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; margin:0 3px; }
  .iconbtn svg { width:15px; height:15px; }
  .ib-edit { background:#eff6ff; border:1px solid #bfdbfe; color:#3b82f6; }
  .ib-del { background:#fef2f2; border:1px solid #fecaca; color:#ef4444; }
  .sel { display:flex; align-items:center; justify-content:space-between; gap:16px; background:#fff;
    border:1px solid #cbd5e1; border-radius:12px; padding:13px 16px; font-size:15px; font-weight:700; color:#0f172a; }
  .sel-open { background:#fff; border:1px solid #cbd5e1; border-radius:12px; overflow:hidden; box-shadow:0 24px 50px rgba(15,23,42,.18); }
  .sel-opt { padding:12px 16px; font-size:15px; font-weight:600; color:#334155; display:flex; justify-content:space-between; }
  .sel-opt.hot { background:#ecfdf5; color:#065f46; font-weight:800; }
  .cursor { width:28px; height:28px; position:absolute; filter:drop-shadow(0 6px 12px rgba(0,0,0,.45)); }
  .cursor svg { width:100%; height:100%; }
  .statbox { background:#fff; border:1px solid #e2e8f0; border-radius:18px; padding:18px 20px; }
  .statbox .v { font-size:38px; font-weight:800; color:#0f172a; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .statbox .k { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:#94a3b8; margin-top:4px; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="grain"></div>
